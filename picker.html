<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-title="picker.title">Choose your lamp</title>
    <link rel="stylesheet" href="fluent.css">
    <script src="i18n.js"></script>
    <style>
    html[data-mica] body {
      background: var(--bg) !important;
    }

    body {
      min-height: 100%;
      padding: 20px;
      gap: 0;
    }

    h1 {
      margin: 0 0 4px;
      font: 600 20px/28px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }

    .sub {
      margin: 0 0 14px;
      color: var(--ink2);
      font-size: 13px;
    }

    #list {
      display: flex;
      flex: 1 1 0;
      flex-direction: column;
      gap: 4px;
      height: 0;
      min-height: 0;
      min-width: 0;
      max-height: calc(100vh - 128px);
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      padding: 0 4px 0 0;
      scrollbar-gutter: stable;
    }

    #list button {
      display: block;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      padding: 10px 14px;
      text-align: left;
      background: var(--card);
      border-radius: 4px;
    }

    #list button span {
      display: block;
      overflow-wrap: anywhere;
    }

    #list button small {
      display: block;
      min-width: 0;
      color: var(--ink3);
      font-size: 12px;
      line-height: 16px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .foot {
      display: flex;
      justify-content: flex-end;
      padding-top: 14px;
    }

    .empty {
      padding: 18px 4px;
      color: var(--ink2);
    }

    @media (max-width: 420px) {
      body {
        padding: 14px;
      }

      h1 {
        font-size: 18px;
      }
    }
    </style>
  </head>
  <body>
    <h1 data-i18n="picker.title">Choose your lamp</h1>
    <p class="sub" id="hint" data-i18n="picker.searchingHint">
      Searching. Lamps are usually named MELK-
    </p>
    <div id="list"></div>
    <div class="foot">
      <button id="cancel" data-i18n="picker.cancel">Cancel</button>
    </div>

    <script src="picker.js"></script>
  </body>
</html>
